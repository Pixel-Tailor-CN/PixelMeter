name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The full commit history is required to generate versionCode correctly.

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGN_KEY_STORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build Release Bundle
        env:
          SIGN_KEY_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: chmod a+x ./gradlew && ./gradlew bundleRelease

      - name: Download bundletool
        run: |
          BUNDLETOOL_VERSION=1.17.2
          curl -fsSL \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            -o bundletool.jar

      - name: Extract Universal APK from AAB
        run: |
          mkdir -p apk-output
          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/release/app-release.aab \
            --output=apk-output/app.apks \
            --mode=universal \
            --ks="$RUNNER_TEMP/release.jks" \
            --ks-pass=pass:${{ secrets.SIGN_KEY_STORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.SIGN_KEY_ALIAS }} \
            --key-pass=pass:${{ secrets.SIGN_KEY_PASSWORD }}
          unzip apk-output/app.apks universal.apk -d apk-output/
          mv apk-output/universal.apk "apk-output/PixelMeter-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
             "apk-output/PixelMeter-${GITHUB_REF_NAME}.aab"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: PixelMeter ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            apk-output/PixelMeter-${{ github.ref_name }}.apk
            apk-output/PixelMeter-${{ github.ref_name }}.aab

      - name: Cleanup Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  submit-to-google-play:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get the signed bundle and notes from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "PixelMeter-${GITHUB_REF_NAME}.aab" --output app-release.aab
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' > CHANGELOG.md

      - name: Prepare localized Google Play release notes
        shell: python
        run: |
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8").strip()
          english = re.search(r"(?m)^【(?:Added|Fixed|Improved)】$", changelog)
          boundary = english.start() if english else len(changelog)
          notes = {"zh-CN": changelog[:boundary].strip(), "en-US": changelog[boundary:].strip()}
          if not any(notes.values()):
              raise SystemExit("The GitHub Release has no release notes.")
          if notes["zh-CN"] and not notes["zh-CN"].startswith(("【新增】", "【修复】", "【优化】")):
              raise SystemExit("Expected a localized category heading at the start of CHANGELOG.md.")

          directory = Path("whatsnew")
          directory.mkdir()
          for language, text in notes.items():
              if text:
                  if len(text) > 500:
                      raise SystemExit(f"{language} release notes exceed Google Play's 500-character limit.")
                  (directory / f"whatsnew-{language}").write_text(text, encoding="utf-8")

      - name: Submit production release for Google Play review
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: vip.mystery0.pixel.meter
          releaseFiles: app-release.aab
          releaseName: ${{ github.ref_name }}
          whatsNewDirectory: whatsnew
          track: production
          status: completed
          changesNotSentForReview: 'false'
